<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SH PLANNER: Planner + Notebook</title>
<meta name="description" content="SH PLANNER: a day/week planner, reminders, habit tracker and rich notebook in one offline-first app. Sign in with Google to sync across devices, or use it without an account. Works offline.">
<meta name="theme-color" content="#0A0C12">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="SH PLANNER">
<meta property="og:description" content="Planner + notebook + habits. Offline, private, installable.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('shp-theme')||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <aside class="side" aria-label="Main">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="34" height="34"><span>SH <b>PLANNER</b></span></div>
    <nav class="side-nav" id="sideNav"></nav>
    <button class="btn primary side-add" data-act="capture"><span class="i i-plus"></span> Quick capture</button>
  </aside>
  <div class="main">
    <header class="top">
      <div class="top-l"><img class="top-logo" src="icons/icon-192.png" alt="" width="28" height="28"><h1 id="topTitle">SH PLANNER</h1></div>
      <div class="top-r">
        <a class="icon-btn sync-ind" id="syncInd" href="#/settings" hidden aria-label="Sync status"><span class="i i-cloud"></span></a>
        <button class="icon-btn" data-act="search" aria-label="Search"><span class="i i-search"></span></button>
        <button class="icon-btn" data-act="theme" aria-label="Toggle theme"><span class="i i-moon"></span></button>
        <a class="icon-btn" href="#/settings" aria-label="Settings"><span class="i i-gear"></span></a>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="bottom" id="bottomNav" aria-label="Main"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">SH PLANNER needs JavaScript.</p></noscript>
<script src="js/vendor/capacitor.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
